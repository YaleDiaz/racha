# Cada vez que subes cambios a GitHub, este archivo le dice a GitHub que compile el APK.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # también puedes lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: write      # para poder publicar el APK en "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Probar las rachas
        run: npm test

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Poner icono, pantalla de inicio y sonidos
        run: cp -r recursos/android/res/. android/app/src/main/res/

      - name: Preparar Android (Health Connect necesita Android 8 o más)
        run: node recursos/preparar-android.js

      - name: Usar siempre la misma firma (para poder actualizar sin perder datos)
        run: |
          mkdir -p ~/.android
          cp recursos/debug.keystore ~/.android/debug.keystore

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: racha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk racha.apk
          gh release create "v${{ github.run_number }}" racha.apk \
            --title "Racha 4.0 · compilación ${{ github.run_number }}" \
            --notes "APK generado automáticamente. Descarga racha.apk e instálalo en tu Android."
