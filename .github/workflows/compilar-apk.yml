name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Probar las rachas
        run: npm test

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Poner icono y pantalla de inicio
        run: cp -r recursos/android/res/. android/app/src/main/res/

      - name: Usar siempre la misma firma
        run: |
          mkdir -p ~/.android
          cp recursos/debug.keystore ~/.android/debug.keystore

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: racha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
